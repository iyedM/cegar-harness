name: CEGAR-Harness CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and integrity tests
        run: pytest -v

      - name: Execute deterministic benchmark & verify artifacts
        run: |
          bash scripts/run_benchmark.sh
          test -f results/benchmark_report.json
          test -f results/strategy_metrics.csv
          test -f results/ablation_metrics.csv
          test -f results/category_breakdown.csv
          test -f results/benchmark_summary.md
          test -f results/counterexamples.sqlite
          test -f results/telemetry_events.jsonl
